[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indextts-worker"
version = "1.0.0"
description = "Personal TTS Worker: FastAPI + RabbitMQ integration for IndexTTS-1.5 zero-shot text-to-speech"
requires-python = "==3.10.*"
license = {text = "Apache-2.0"}
authors = [
    {name = "0xmichaelran", email = "michaelran16@gmail.com"}
]
keywords = ["TTS", "text-to-speech", "zero-shot", "voice-cloning", "fastapi", "rabbitmq", "worker", "microservice"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
]
readme = "indextts/README.md"

dependencies = [
    # Cross-platform common dependencies only
    # Text processing
    "cn2an==0.5.22",
    "g2p-en==2.1.0",
    "jieba==0.42.1",
    
    # Audio processing utilities
    "ffmpeg-python==0.2.0",
    "librosa",
    "pyloudnorm>=0.1.0",  # For LUFS loudness normalization
    "soundfile",  # For time-stretching audio in ratio parameter
    "sentencepiece",
    
    # Data processing (moved to extras to avoid conflicts with CUDA packages)
    "omegaconf",
    
    # Visualization (required by BigVGAN utils)
    "matplotlib",
    
    # ML/Transformers (required by GPT models)
    "transformers",
    "tokenizers",
    "accelerate",
    "einops",
    
    # Utilities
    "tqdm",
    
    # REST API server - needed for run-indextts-1-5.py
    "fastapi[standard]",
    "uvicorn[standard]",
    
    # RabbitMQ worker (for distributed task queue)
    "pika",
    "python-multipart",
    "python-dotenv",
    
    # S3 storage (for audio file persistence)
    "boto3>=1.28.0",
    
    # Database (for synthesis cache)
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg2-binary>=2.9.9",
    
    # Forced alignment (stable-whisper, mandatory for all jobs)
    "stable-ts",      # stable-ts >= 2.19.1; brings openai-whisper transitively
    "torch",          # explicit to allow macOS CPU-only resolution without CUDA extras
    "torchaudio",     # explicit for the same reason

    # Platform-specific text processing
    "wetext; sys_platform == 'darwin'",
    "WeTextProcessing; sys_platform != 'darwin'",
]

[project.optional-dependencies]
# Windows CUDA environment - Full GPU inference with IndexTTS models
cuda = [
    # Core ML dependencies
    "torch>=2.1.2",
    "torchaudio",
    "transformers==4.36.2",
    "tokenizers==0.15.0",
    "accelerate==0.25.0",
    "einops==0.8.1",
    "vocos==0.1.0",
    "numba==0.58.1",
    "keras==2.9.0",
    "tensorboard==2.9.1",
    "matplotlib==3.8.2",
    "opencv-python==4.9.0.80",
    "huggingface-hub>=0.19.3,<1.0",
    
    # Data processing (pinned for CUDA compatibility)
    "Cython==3.0.7",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.1.0",
]

# macOS native TTS - Lightweight testing without GPU dependencies
mac = [
    "pyobjc-framework-AVFoundation>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]

# Gradio web UI
webui = [
    "gradio",
]

# Development tools
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

# Platform-specific all installations
all-windows = [
    "indextts-worker[cuda,webui,dev]",
]

all-mac = [
    "indextts-worker[mac,webui,dev]",
]

# Legacy all option (defaults to CUDA for backwards compatibility)
all = [
    "indextts-worker[cuda,webui,dev]",
]

[project.scripts]
indextts = "indextts.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["indextts*", "services*", "app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "macos: marks tests as macOS-specific (deselect with '-m \"not macos\"')",
    "cuda: marks tests as requiring CUDA/GPU (deselect with '-m \"not cuda\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
