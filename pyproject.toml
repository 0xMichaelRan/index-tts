[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indextts-worker"
version = "1.0.0"
description = "Personal TTS Worker: FastAPI + RabbitMQ integration for IndexTTS-1.5 zero-shot text-to-speech"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "0xmichaelran", email = "michaelran16@gmail.com"}
]
keywords = ["TTS", "text-to-speech", "zero-shot", "voice-cloning", "fastapi", "rabbitmq", "worker", "microservice"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
]

dependencies = [
    # Core dependencies (from setup.py)
    "torch>=2.1.2",
    "torchaudio",
    "transformers==4.36.2",
    "tokenizers==0.15.0",
    "accelerate==0.25.0",
    "einops==0.8.1",
    
    # Processing dependencies (from requirements.txt)
    "cn2an==0.5.22",
    "ffmpeg-python==0.2.0",
    "Cython==3.0.7",
    "g2p-en==2.1.0",
    "jieba==0.42.1",
    "numba==0.58.1",
    "numpy==1.26.2",
    "pandas==2.1.3",
    
    # Audio processing
    "librosa",
    "vocos==0.1.0",
    "sentencepiece",
    
    # ML/DL utilities
    "keras==2.9.0",
    "tensorboard==2.9.1",
    "omegaconf",
    
    # Visualization
    "matplotlib==3.8.2",
    "opencv-python==4.9.0.80",
    
    # Utilities
    "tqdm",
    
    # Platform-specific text processing
    "wetext; sys_platform == 'darwin'",
    "WeTextProcessing; sys_platform != 'darwin'",
]

[project.optional-dependencies]
worker = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "pika",
    "python-multipart",
]

webui = [
    "gradio",
]

dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

all = [
    "indextts-worker[worker,webui,dev]",
]

[project.urls]
Homepage = "https://github.com/0xmichaelran/indexTTS-worker"
Repository = "https://github.com/0xmichaelran/indexTTS-worker"
Documentation = "https://github.com/0xmichaelran/indexTTS-worker/blob/main/README.md"
Issues = "https://github.com/0xmichaelran/indexTTS-worker/issues"
"Source (Original IndexTTS)" = "https://github.com/index-tts/index-tts"

[project.scripts]
indextts = "indextts.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["indextts*"]
exclude = ["tests*"]
