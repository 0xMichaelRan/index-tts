[pytest]
# Pytest configuration for IndexTTS tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers for platform-specific tests
markers =
    macos: marks tests as macOS-specific
    cuda: marks tests as requiring CUDA/GPU
    slow: marks tests as slow-running

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
